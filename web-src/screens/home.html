<div class="app app-home">
  <div class="app-scroll">
    <div class="app-top">
      <div>
        <div class="app-clock" data-clock>9:41</div>
        <div class="app-date" data-date>Monday, 26 October</div>
      </div>
      <div class="app-status">
        <span class="app-bat">{{icon:battery_full}}86%</span>
        <span class="app-gear">{{icon:settings}}</span>
      </div>
    </div>
    <div class="app-card app-checkin t-brand" data-checkin>
      <div class="app-card-title">Good morning, <span data-india="Kamala" data-senior>Margaret</span></div>
      <div class="app-card-sub" data-checkin-sub>Tap once to tell your family you're OK today.</div>
      <button class="app-btn t-grn" data-ok>{{icon:check}}<span>I'm OK</span></button>
      <div class="app-ok-done" data-ok-done hidden>{{icon:check_circle}}<span>Your family knows you're OK</span></div>
    </div>
    <div class="app-faces">
      <button class="app-face" data-name="James" data-india-name="Ravi"><span class="av t-tea" data-india="R">J</span><span data-india="Ravi">James</span></button>
      <button class="app-face" data-name="Sarah" data-india-name="Asha"><span class="av t-pur" data-india="A">S</span><span data-india="Asha">Sarah</span></button>
      <button class="app-face" data-name="Dr. Lee" data-india-name="Dr. Sen"><span class="av t-blu" data-india="DS">DL</span><span data-india="Dr. Sen">Dr. Lee</span></button>
    </div>
    <button class="app-soft t-blu" data-callme>{{icon:phone_callback}}<span>Ask my family to call me</span></button>
    <div class="app-tiles">
      <div class="app-tile t-grn"><i class="chip">{{icon:call}}</i><span>Phone</span></div>
      <div class="app-tile t-wa"><i class="chip">{{icon:chat}}</i><span>WhatsApp</span></div>
      <div class="app-tile t-org"><i class="chip">{{icon:medication}}</i><span>Medicines</span></div>
      <div class="app-tile t-brand"><i class="chip">{{icon:shield}}</i><span>Is it a scam?</span></div>
    </div>
  </div>
  <div class="app-bottom">
    <button class="app-speak" data-speak>{{icon:mic}}<span>Speak</span></button>
    <button class="app-sos" data-sos><i class="fill"></i>{{icon:sos}}<span class="lbl">Get help</span></button>
  </div>
  <div class="app-dialog" data-dialog hidden>
    <div class="app-dialog-card">
      <span class="av av-xl t-tea" data-dialog-av>J</span>
      <div class="app-dialog-title" data-dialog-text>Call James?</div>
      <button class="app-btn t-grn" data-yes>{{icon:call}}<span>Yes, call</span></button>
      <button class="app-btn t-gry" data-no>{{icon:close}}<span>No</span></button>
    </div>
  </div>
</div>
