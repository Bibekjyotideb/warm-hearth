<div class="app app-alert">
  <div class="app-alert-title">Time for your medicine</div>
  <div class="app-pill">
    <svg viewBox="0 0 220 150" aria-hidden="true"><rect x="10" y="20" width="200" height="110" rx="14" fill="#ECEAE4" stroke="#CFCAC0" stroke-width="2"/>
    <g fill="#FFFFFF" stroke="#CFCAC0" stroke-width="2"><ellipse cx="55" cy="55" rx="24" ry="16"/><ellipse cx="110" cy="55" rx="24" ry="16"/><ellipse cx="165" cy="55" rx="24" ry="16"/><ellipse cx="55" cy="97" rx="24" ry="16"/><ellipse cx="110" cy="97" rx="24" ry="16"/></g>
    <ellipse cx="165" cy="97" rx="24" ry="16" fill="none" stroke="#CFCAC0" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="110" y="146" font-size="11" text-anchor="middle" fill="#6B7479" font-family="sans-serif" data-india="TELMA 40">AMLODIPINE 5</text></svg>
  </div>
  <div class="app-medname" data-india="Telma 40">Amlodipine</div>
  <div class="app-dose" data-india="1 tablet, 8:00 am">5 mg, 1 tablet, 8:00 am</div>
  <div class="app-btn t-grn">{{icon:check}}<span>I took it</span></div>
  <div class="app-soft t-gry">{{icon:snooze}}<span>Remind me in 10 minutes</span></div>
</div>
