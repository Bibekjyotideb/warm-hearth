<div class="app app-alert">
  <div class="app-alert-title">Time for your medicine</div>
  <div class="app-pill">
    <svg viewBox="0 0 220 150" aria-hidden="true"><rect x="10" y="20" width="200" height="110" rx="14" fill="#E9ECEF" stroke="#C9CFD4" stroke-width="2"/>
    <g fill="#FFFFFF" stroke="#C9CFD4" stroke-width="2"><ellipse cx="55" cy="55" rx="24" ry="16"/><ellipse cx="110" cy="55" rx="24" ry="16"/><ellipse cx="165" cy="55" rx="24" ry="16"/><ellipse cx="55" cy="97" rx="24" ry="16"/><ellipse cx="110" cy="97" rx="24" ry="16"/></g>
    <ellipse cx="165" cy="97" rx="24" ry="16" fill="none" stroke="#C9CFD4" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="110" y="146" font-size="11" text-anchor="middle" fill="#6B7479" font-family="sans-serif">TELMA 40</text></svg>
  </div>
  <div class="app-medname">Telma 40</div>
  <div class="app-dose">1 tablet · 8:00 am</div>
  <div class="app-btn" style="--c:#1E7B34">{{icon:check}}<span>I took it</span></div>
  <div class="app-btn" style="--c:#4E5B62">{{icon:snooze}}<span>Remind me in 10 minutes</span></div>
</div>
