<div class="app app-family">
  <div class="app-pagehead"><span class="app-back">{{icon:arrow_back}}</span><span class="app-title">Photos &amp; notes</span></div>
  <div class="fam-card">
    <b data-india="Send Maa a photo or a note">Send Mom a photo or a note</b>
    <div class="app-photo">{{sunrise}}</div>
    <div class="fam-input" data-india="Sunrise from our new balcony, Maa. Come and see it soon!">Sunrise from our new balcony, Mom. Come and see it soon!</div>
    <div class="fam-actions" style="grid-template-columns:1fr 1fr">
      <div class="app-soft t-pnk" style="min-height:11cqi;font-size:3.8cqi">{{icon:add_a_photo}}<span>Change photo</span></div>
      <div class="app-soft t-brand" style="min-height:11cqi;font-size:3.8cqi">{{icon:send}}<span>Send</span></div>
    </div>
  </div>
  <div class="fam-card">
    <div class="fam-row"><span class="fam-ib t-pnk">{{icon:image}}</span><span class="n">Riya's sports day<small style="color:#1E7B34">Yesterday, seen</small></span></div>
    <div class="fam-row"><span class="fam-ib t-pnk">{{icon:edit_note}}</span><span class="n"><span data-india="Happy Diwali, Maa!">Happy birthday, Mom!</span><small style="color:#1E7B34">Saturday, seen</small></span></div>
  </div>
</div>
