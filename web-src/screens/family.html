<div class="app app-family">
  <div class="fam-head"><span class="app-title">Maa's phone</span><span class="fam-pill">Unlocked</span></div>
  <div class="fam-tabs"><span class="on">Alerts</span><span>People</span><span>Medicines</span></div>
  <div class="fam-card fam-sos">
    <div class="fam-ico" style="--c:#C2342B">{{icon:sos}}</div>
    <div><b>Maa pressed SOS and needs help</b><span>Just now · tap for map</span></div>
  </div>
  <div class="fam-card">
    <div class="fam-ico" style="--c:#B85C00">{{icon:medication}}</div>
    <div><b>Maa hasn't taken Telma 40</b><span>Due at 8:00 am · 32 min ago</span></div>
  </div>
  <div class="fam-card">
    <div class="fam-ico" style="--c:#1E7B34">{{icon:check_circle}}</div>
    <div><b>Morning medicines taken</b><span>Yesterday · 8:04 am</span></div>
  </div>
  <div class="fam-add">{{icon:person_add}}<span>Add a person to Maa's phone</span></div>
</div>
