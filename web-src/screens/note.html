<div class="app app-home">
  <div class="app-scroll">
    <div class="app-top">
      <div><div class="app-clock">4:20</div><div class="app-date">Monday, 26 October</div></div>
      <div class="app-status"><span class="app-bat">{{icon:battery_full}}71%</span><span class="app-gear">{{icon:settings}}</span></div>
    </div>
    <div class="app-card" style="--s:#fff">
      <div class="app-photo">{{sunrise}}</div>
      <div class="app-meta">From Ravi, 2 hours ago</div>
      <div class="app-notetext">Sunrise from our new balcony, Maa. Come and see it soon!</div>
      <div class="app-soft t-grn">{{icon:call}}<span>Call Ravi</span></div>
    </div>
    <div class="app-faces">
      <div class="app-face"><span class="av t-tea">R</span><span>Ravi</span></div>
      <div class="app-face"><span class="av t-pur">A</span><span>Asha</span></div>
      <div class="app-face"><span class="av t-blu">DS</span><span>Dr. Sen</span></div>
    </div>
  </div>
  <div class="app-bottom">
    <div class="app-speak">{{icon:mic}}<span>Speak</span></div>
    <div class="app-sos">{{icon:sos}}<span class="lbl">Get help</span></div>
  </div>
</div>
