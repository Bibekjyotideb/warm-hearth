<div class="app app-call">
  <div class="sub">Incoming call</div>
  <div class="num">+91 70xxx 41822</div>
  <div class="sub">Not in your contacts</div>
  <div class="warn">
    <b>{{icon:shield}}Unknown number calling</b>
    <span>Banks, police and companies never ask for an OTP, PIN or money on a call. If unsure, hang up and call family.</span>
  </div>
  <div class="actions">
    <span class="round" style="background:#C62828">{{icon:call_end}}</span>
    <span class="round" style="background:#1E7B34">{{icon:call}}</span>
  </div>
</div>
