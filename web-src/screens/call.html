<div class="app app-home app-dimmed">
  <div class="app-top"><div><div class="app-clock">9:41</div><div class="app-date">Sunday, 25 October</div></div></div>
  <div class="app-faces">
    <div class="app-face"><span class="av" style="--c:#5E35B1">A</span><span>Asha</span></div>
    <div class="app-face"><span class="av" style="--c:#00695C">R</span><span>Ravi</span></div>
    <div class="app-face"><span class="av" style="--c:#1B5E8C">DS</span><span>Dr. Sen</span></div>
  </div>
  <div class="app-dialog">
    <div class="app-dialog-card">
      <span class="av av-xl" style="--c:#5E35B1">A</span>
      <div class="app-dialog-title">Call Asha?</div>
      <div class="app-btn" style="--c:#1E7B34">{{icon:call}}<span>Yes, call</span></div>
      <div class="app-btn" style="--c:#4E5B62">{{icon:close}}<span>No</span></div>
    </div>
  </div>
</div>
